<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 180" width="1200" height="180" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0D0B2A"/>
      <stop offset="55%"  stop-color="#6B2D6B"/>
      <stop offset="100%" stop-color="#F4A460"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- SKY BG -->
  <rect width="1200" height="180" fill="url(#skyG)"/>

  <!-- Sun -->
  <circle cx="1050" cy="55" r="32" fill="#FFF176" opacity="0.95">
    <animate attributeName="r" values="32;35;32"
      dur="6s" begin="0s" repeatCount="indefinite" fill="none"/>
  </circle>
  <circle cx="1050" cy="55" r="48" fill="#FFF176" opacity="0.08">
    <animate attributeName="r" values="48;58;48"
      dur="6s" begin="0s" repeatCount="indefinite" fill="none"/>
  </circle>

  <!-- Horizon glow -->
  <rect y="160" width="1200" height="10" fill="#F4A460" opacity="0.3"/>

  <!-- ══ BOSS HUD ══ -->
  <rect x="760" y="14" width="420" height="88"
    fill="black" opacity="0.72" rx="5"
    stroke="#FF1744" stroke-width="1" stroke-opacity="0.8"/>
  <!-- Corner marks -->
  <rect x="760"  y="14"  width="14" height="2"  fill="#FF1744"/>
  <rect x="760"  y="14"  width="2"  height="14" fill="#FF1744"/>
  <rect x="1166" y="14"  width="14" height="2"  fill="#FF1744"/>
  <rect x="1178" y="14"  width="2"  height="14" fill="#FF1744"/>
  <rect x="760"  y="100" width="14" height="2"  fill="#FF1744"/>
  <rect x="760"  y="88"  width="2"  height="14" fill="#FF1744"/>

  <text x="776" y="34"  font-family="monospace" font-size="10" fill="#FF5252" letter-spacing="2">⚔ BOSS RAID TARGET</text>
  <text x="776" y="52"  font-family="monospace" font-size="16" font-weight="bold" fill="#FF1744" letter-spacing="3">KRAKEN</text>
  <text x="776" y="67"  font-family="monospace" font-size="9"  fill="#EF9A9A">MILESTONE: 100 → 250 commits</text>

  <!-- Boss HP bar -->
  <rect x="776" y="74" width="265" height="10" fill="#1A0000" rx="3"/>
  <rect x="776" y="74" width="81" height="10" fill="#FF7043" rx="3">
    <animate attributeName="width" values="0;81" dur="1.5s" fill="freeze"/>
  </rect>
  <rect x="776" y="74" width="81" height="5" fill="white" opacity="0.12" rx="3"/>
  <text x="776" y="98" font-family="monospace" font-size="9" fill="#EF9A9A">104 HP REMAINING — COMMIT TO DEAL DAMAGE</text>

  <!-- Time display -->
  <text x="22" y="32" font-family="monospace" font-size="11" fill="#00E5FF" opacity="0.7" letter-spacing="1">
    DAWN — UTC+7 — 06:XX
  </text>
</svg>